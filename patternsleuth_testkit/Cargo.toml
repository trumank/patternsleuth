[package]
name = "patternsleuth_testkit"
repository.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
description = "Synthetic memory and image fixtures for patternsleuth tests"

[dependencies]
patternsleuth = { path = "../patternsleuth", default-features = false }
